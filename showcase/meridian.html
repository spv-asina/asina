section{scroll-margin-top:84px}
.spv-concept-notice{position:relative;z-index:1200;min-height:38px!important;padding-block:7px!important;background:linear-gradient(110deg,#17131b,#281d2d 56%,#17131b)!important;border-bottom:1px solid rgba(255,255,255,.1);box-shadow:0 8px 28px rgba(18,10,22,.12)}
body h1,body h2,body h3{text-wrap:balance;overflow-wrap:normal;word-break:normal;hyphens:none}
body p,body li{text-wrap:pretty}
body :is(a,button)[class*="-btn"],body .btn{position:relative;isolation:isolate;overflow:hidden;transform:translateZ(0);will-change:transform;transition:transform .42s cubic-bezier(.16,1,.3,1),box-shadow .42s cubic-bezier(.16,1,.3,1),filter .32s ease,background-color .32s ease,color .32s ease,border-color .32s ease!important}
body :is(a,button)[class*="-btn"]::after,body .btn::after{content:"";position:absolute;z-index:-1;top:-90%;left:-45%;width:34%;height:280%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);transform:translateX(-430%) rotate(18deg);transition:transform .68s cubic-bezier(.16,1,.3,1);pointer-events:none}
body :is(a,button)[class*="-btn"]:focus-visible,body .btn:focus-visible,body summary:focus-visible,body input:focus-visible,body textarea:focus-visible,body select:focus-visible{outline:3px solid color-mix(in srgb,var(--v40-accent,#754090) 42%,white);outline-offset:4px}
body summary{transition:color .3s ease,background-color .3s ease,padding-left .35s cubic-bezier(.16,1,.3,1)}
body details[open]>:not(summary){animation:v40-details .42s cubic-bezier(.16,1,.3,1) both}
body select{appearance:none;-webkit-appearance:none;padding-right:44px!important;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%)!important;background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%!important;background-size:6px 6px,6px 6px!important;background-repeat:no-repeat!important}
body header{transition:box-shadow .42s ease,background-color .42s ease,border-color .42s ease,backdrop-filter .42s ease}
body.v40-scrolled header{box-shadow:0 16px 44px rgba(26,17,29,.1)}
.v40-form-note{margin:10px 0 0;font-size:11px;line-height:1.45;color:inherit;opacity:.72}
@keyframes v40-details{from{opacity:0;transform:translateY(-8px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@media(hover:hover) and (pointer:fine){
  body :is(a,button)[class*="-btn"]:hover,body .btn:hover{transform:translateY(-3px) scale(1.008);filter:saturate(1.06);box-shadow:0 16px 36px color-mix(in srgb,var(--v40-accent,#754090) 20%,transparent),0 5px 14px rgba(15,10,18,.1)!important}
  body :is(a,button)[class*="-btn"]:hover::after,body .btn:hover::after{transform:translateX(690%) rotate(18deg)}
  body summary:hover{padding-left:8px}
}
@media(max-width:760px){html{scroll-padding-top:72px}section{scroll-margin-top:72px}.spv-concept-notice{min-height:42px!important;padding-inline:12px!important;font-size:7.5px!important;line-height:1.35!important;overflow:hidden}.spv-concept-notice span:first-child{flex:0 0 auto;white-space:nowrap}.spv-concept-notice span:last-child{max-width:none!important;font-size:0!important;white-space:nowrap}.spv-concept-notice span:last-child::after{content:"КОНЦЕПТ ДЛЯ ПОРТФОЛИО";font-size:7px;letter-spacing:.05em}body input,body textarea,body select{font-size:16px!important}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}body *,body *::before,body *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
