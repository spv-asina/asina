name: Interactive case labs browser audit
on:
  push:
    branches: ['feat/interactive-case-demos-20261115']
  pull_request:
    paths:
      - 'case-*.html'
      - 'assets/labs*.js'
      - 'assets/labs.css'
      - 'scripts/audit_interactive_labs.py'
      - '.github/workflows/interactive-labs.yml'
permissions:
  contents: read
jobs:
  lab-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify 34 distinct case narratives and generated HTML
        run: |
          python scripts/update_case_sections.py --check
          python scripts/audit_case_narratives.py
      - name: Interact with all 34 labs and inspect 11 embedded sites
        run: python scripts/audit_interactive_labs.py
      - name: Upload screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-case-labs-audit
          path: artifacts/interactive-labs/
          if-no-files-found: warn
