name: 11 bespoke showcase websites — visual and interaction QA
on:
  push:
    branches: ['feat/showcase-sites-rework-20261116']
  pull_request:
    paths:
      - 'case-site-*.html'
      - 'showcase/**'
      - 'assets/showcase-*.css'
      - 'assets/showcase-art.js'
      - 'assets/showcase-experience-v7.js'
      - 'assets/site-demo-controls.js'
      - 'scripts/audit_showcase_v7.py'
      - '.github/workflows/showcase-sites.yml'
permissions:
  contents: read
jobs:
  visual-and-interaction-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium webkit
      - name: Test eleven distinct creative homepages and preserved interactive widgets
        run: python scripts/audit_showcase_v7.py
      - name: Upload design review screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-11-unique-experiences
          path: artifacts/showcase-v7/
          if-no-files-found: warn
